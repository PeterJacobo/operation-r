services:
  operation-r:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: operation-r
    restart: unless-stopped
    ports:
      - "5000:5000" # Flask/FastAPI webhook listener
    environment:
      - PRINTER_IP=${PRINTER_IP} # Rongta printer's IP
      - USB_VENDOR_ID=${USB_VENDOR_ID}
      - USB_PRODUCT_ID=${USB_PRODUCT_ID}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    devices:
      - "/dev/usb/lp0:/dev/usb/lp0"  # Maps the USB printer device into the container
    privileged: true  # Grants access to USB devices
    volumes:
      - ./data:/app/data # Optional: for logs or persistent config
      - ./credentials.json:/app/credentials.json
      - ./token.pickle:/app/token.pickle
    networks:
      - operation-net

networks:
  operation-net:
    driver: bridge